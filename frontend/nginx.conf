log_format prometheus_json escape=json
'{'
    '"host":"$host",'
    '"method":"$request_method",'
    '"uri":"$uri",'
    '"status":$status,'
    '"request_time":$request_time,'
    '"bytes_sent":$bytes_sent,'
    '"request_length":$request_length'
'}';

server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;

    access_log /var/log/nginx/exporter-access.log prometheus_json;

    # Read by the page's delivery receipt via PerformanceNavigationTiming.serverTiming.
    # NODE_NAME comes from the downward API and is filled in by the image's envsubst step.
    add_header Server-Timing 'pod;desc="$hostname", node;desc="${NODE_NAME}"' always;

    # Pages are exported as /name.html, but some names are also directories
    # (/topics.html next to /topics/kubernetes.html). Trying $uri/ first made
    # nginx 301 /topics to http://host:3000/topics/ (its own port), which then
    # 403'd with no index. Relative redirects, .html before directories, and
    # no bare directory match fixes both.
    absolute_redirect off;

    # /topics/ -> /topics, so trailing-slash links land on the page too.
    location ~ ^(.+)/$ {
        return 301 $1;
    }

    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }

    location /_next/static/ {
        access_log off;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
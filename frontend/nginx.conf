server {
    listen 3000;
    # Catch-all host (Traefik sends real Host header; nginx does not need to match it)
    server_name _;
    root /usr/share/nginx/html;

    location / {
        # Next static export: e.g. /about → about/index.html, /thoughts/foo → thoughts/foo/index.html
        try_files $uri $uri/ $uri.html =404;
    }

    location /_next/static/ {
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
